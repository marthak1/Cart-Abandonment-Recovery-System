
name: CI/CD - Full Stack E-commerce

on:
  push:
    branches: [ main]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
  actions: write
  checks: write
  pull-requests: write
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================
  # JOB 1: Backend Build & Test
  # ============================================
  backend-build-test:
    name: Backend - Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build and test with Maven
        working-directory: ecommerce-backend/ecommerce-backend
        run: |
          chmod +x mvnw
          ./mvnw clean verify
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Generate test report
        if: always()
        uses: dorny/test-reporter@v1
        env:
          GITHUB_TOKEN: ${{ github.repository }}
        with:
          name: Backend Test Results
          path: ecommerce-backend/ecommerce-backend/target/surefire-reports/*.xml
          reporter: java-junit

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: backend-coverage
          path: ecommerce-backend/ecommerce-backend/target/site/jacoco/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: ecommerce-backend/ecommerce-backend/target/*.jar
          retention-days: 1

  # ============================================
  # JOB 2: Frontend Build & Test
  # ============================================
  frontend-build-test:
    name: Frontend - Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ecommerce-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ecommerce-frontend
        run: npm ci

      - name: Run linter
        working-directory: ecommerce-frontend
        run: npm run lint || true

      - name: Run tests
        working-directory: ecommerce-frontend
        run: npm run test:run

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: ecommerce-frontend/coverage/
          retention-days: 7

      - name: Build production bundle
        working-directory: ecommerce-frontend
        run: npm run build
        env:
          VITE_APP_API_URL: ${{ secrets.VITE_APP_API_URL || 'http://localhost:8080' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ecommerce-frontend/dist/
          retention-days: 1

  # ============================================
  # JOB 3: Build Docker Images
  # ============================================
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./ecommerce-backend/ecommerce-backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./ecommerce-frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_MODE=production

  # ============================================
  # JOB 4: Deploy
  # ============================================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          mkdir -p deployment
          cp docker-compose.yml deployment/
          cp .env.example deployment/.env
          tar -czf deployment.tar.gz deployment/

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deployment.tar.gz
          retention-days: 30

      - name: Capture deployment evidence
        run: |
          echo "## Deployment Evidence" > deployment-evidence.md
          echo "- **Date**: $(date)" >> deployment-evidence.md
          echo "- **Commit**: ${{ github.sha }}" >> deployment-evidence.md
          echo "- **Branch**: ${{ github.ref_name }}" >> deployment-evidence.md
          echo "- **Triggered by**: ${{ github.actor }}" >> deployment-evidence.md
          echo "- **Build Number**: ${{ github.run_number }}" >> deployment-evidence.md

      - name: Upload deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence
          path: deployment-evidence.md
          retention-days: 90

